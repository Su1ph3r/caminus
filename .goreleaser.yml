version: 2
project_name: caminus

before:
  hooks:
    # NOT `go mod tidy`: tidy runs with default build tags and would prune the
    # build-tag-only dependencies (gopkg.in/yaml.v3 for `-tags yaml`, the cloud
    # SDKs for `-tags cloud`) from go.mod. `download` fetches without mutating.
    - go mod download

builds:
  - main: ./cmd/caminus
    binary: caminus
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}}

# Prebuilt binaries are the dependency-free core build (no `-tags cloud|yaml`);
# cloud enumeration and the structural-YAML engine are opt-in source builds.
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'

# Homebrew tap (macOS, via cask — GoReleaser deprecated `brews:`/formulas in
# favor of `homebrew_casks:`). Requires a `Su1ph3r/homebrew-tap` repo and a PAT
# with write access to it in the TAP_GITHUB_TOKEN secret. SKIP_PKG_PUBLISH (set
# by the release workflow when that secret is absent) lets binary releases
# succeed before the tap is set up. The post-install hook strips the macOS
# quarantine xattr so Gatekeeper does not block the unsigned binary.
homebrew_casks:
  - name: caminus
    binaries:
      - caminus
    repository:
      owner: Su1ph3r
      name: homebrew-tap
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: "https://github.com/Su1ph3r/caminus"
    description: "Multi-platform CI/CD pipeline attack-surface scanner and attack-path synthesizer"
    skip_upload: "{{ .Env.SKIP_PKG_PUBLISH }}"
    commit_author:
      name: release-bot
      email: release-bot@users.noreply.github.com
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/caminus"]
          end

# Scoop bucket (Windows). Requires a `Su1ph3r/scoop-bucket` repo and the same
# TAP_GITHUB_TOKEN. Gated identically by SKIP_PKG_PUBLISH.
scoops:
  - name: caminus
    repository:
      owner: Su1ph3r
      name: scoop-bucket
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/Su1ph3r/caminus"
    description: "Multi-platform CI/CD pipeline attack-surface scanner and attack-path synthesizer"
    license: "MIT"
    skip_upload: "{{ .Env.SKIP_PKG_PUBLISH }}"
    commit_author:
      name: release-bot
      email: release-bot@users.noreply.github.com
