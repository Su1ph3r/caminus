name: CI
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@0123456789abcdef0123456789abcdef01234567
      - name: Test
        env:
          TITLE: ${{ github.event.head_commit.message }}
        run: go test ./...
